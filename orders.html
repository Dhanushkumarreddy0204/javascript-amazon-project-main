<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Orders</title>
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/orders.css">
  </head>
  <body>
    <header class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link" aria-label="Amazon home">
          <img class="amazon-logo" src="images/amazon-logo-white.png" alt="">
          <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png" alt="">
        </a>
      </div>
      <form class="amazon-header-middle-section" action="amazon.html" role="search">
        <input class="search-bar" type="search" name="q" aria-label="Search products" placeholder="Search">
        <button class="search-button" aria-label="Search"><img class="search-icon" src="images/icons/search-icon.png" alt=""></button>
      </form>
      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html"><span class="returns-text">Returns</span><span class="orders-text">&amp; Orders</span></a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="">
          <span class="cart-quantity js-cart-quantity"></span><span class="cart-text">Cart</span>
        </a>
      </div>
    </header>
    <main class="main">
      <h1 class="page-title">Your Orders</h1>
      <p class="shop-message" role="status" hidden></p>
      <div class="orders-grid"></div>
      <template id="order">
        <article class="order-container">
          <div class="order-header">
            <div class="order-header-left-section">
              <div class="order-date"><div class="order-header-label">Order placed</div><time></time></div>
              <div class="order-total"><div class="order-header-label">Order total</div><span></span></div>
            </div>
            <div class="order-header-right-section"><div class="order-header-label">Order ID</div><span></span></div>
          </div>
          <div class="order-details-grid"></div>
        </article>
      </template>
      <template id="order-item">
        <div class="product-image-container"><img alt=""></div>
        <div class="product-details">
          <div class="product-name"></div>
          <div class="product-delivery-date"></div>
          <div class="product-quantity"></div>
          <button class="buy-again-button button-primary"><img class="buy-again-icon" src="images/icons/buy-again.png" alt="">Buy it again</button>
        </div>
        <div class="product-actions"><a class="track-package-button button-secondary">Track package</a></div>
      </template>
    </main>
    <script type="module" src="./scripts/orders.js"></script>
  </body>
</html>
