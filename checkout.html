<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  </head>
  <body>
    <header class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="amazon.html" aria-label="Amazon home">
            <img class="amazon-logo" src="images/amazon-logo.png" alt="">
            <img class="amazon-mobile-logo" src="images/amazon-mobile-logo.png" alt="">
          </a>
        </div>
        <div class="checkout-header-middle-section">Checkout (<a class="return-to-home-link js-return-to-homepage" href="amazon.html">Cart</a>)</div>
        <div class="checkout-header-right-section"><img src="images/icons/checkout-lock-icon.png" alt=""></div>
      </div>
    </header>
    <main class="main">
      <h1 class="page-title">Review your order</h1>
      <p class="shop-message" role="status" hidden></p>
      <div class="checkout-grid">
        <section class="order-summary js-order-summary" aria-label="Cart items"></section>
        <section class="payment-summary js-payment-summary" aria-label="Order total" hidden></section>
      </div>
    </main>
    <script type="module" src="./scripts/checkout.js"></script>
  </body>
</html>
