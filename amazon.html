<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amazon Project</title>
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/amazon.css">
  </head>
  <body>
    <header class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link" aria-label="Amazon home">
          <img class="amazon-logo" src="images/amazon-logo-white.png" alt="">
          <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png" alt="">
        </a>
      </div>
      <form class="amazon-header-middle-section" action="amazon.html" role="search">
        <input class="search-bar" type="search" name="q" aria-label="Search products" placeholder="Search">
        <button class="search-button" aria-label="Search"><img class="search-icon" src="images/icons/search-icon.png" alt=""></button>
      </form>
      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html"><span class="returns-text">Returns</span><span class="orders-text">&amp; Orders</span></a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="">
          <span class="cart-quantity js-cart-quantity"></span><span class="cart-text">Cart</span>
        </a>
      </div>
    </header>
    <main class="main">
      <p class="shop-message" role="status" hidden></p>
      <div class="products-grid js-products-grid" aria-label="Products"></div>
    </main>
    <script type="module" src="./scripts/amazon.js"></script>
  </body>
</html>
